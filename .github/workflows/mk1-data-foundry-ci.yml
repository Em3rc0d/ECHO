name: MK1 Data Foundry CI

on:
  push:
    branches: [main]
    paths:
      - 'src/echo/data_foundry/**'
      - 'tests/data_foundry/**'
      - 'configs/data_foundry/**'
      - 'schemas/data_foundry/**'
      - 'scripts/data_foundry/**'
      - 'scripts/check_modeling_gate_wiring.py'
      - 'MK1/build/data-foundry/**'
      - 'pyproject.toml'
      - '.github/workflows/mk1-data-foundry-ci.yml'
      - '.github/workflows/mk1-corpus-readiness.yml'
      - '.github/workflows/mk1-corpus-certificate.yml'
      - '.github/workflows/mk1-model-entry-gate.yml'
  pull_request:
    paths:
      - 'src/echo/data_foundry/**'
      - 'tests/data_foundry/**'
      - 'configs/data_foundry/**'
      - 'schemas/data_foundry/**'
      - 'scripts/data_foundry/**'
      - 'scripts/check_modeling_gate_wiring.py'
      - 'MK1/build/data-foundry/**'
      - 'pyproject.toml'
      - '.github/workflows/mk1-data-foundry-ci.yml'
      - '.github/workflows/mk1-corpus-readiness.yml'
      - '.github/workflows/mk1-corpus-certificate.yml'
      - '.github/workflows/mk1-model-entry-gate.yml'

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts/data_foundry
      - name: Validate registries, policies and schemas
        run: |
          python -m json.tool configs/data_foundry/source_registry.v1.json >/dev/null
          python -m json.tool configs/data_foundry/acquisition_registry.v1.json >/dev/null
          python -m json.tool configs/data_foundry/label_mapping.v1.json >/dev/null
          python -m json.tool configs/data_foundry/license_policy.v1.json >/dev/null
          python -m json.tool configs/data_foundry/split_policy.v1.json >/dev/null
          python -m json.tool configs/data_foundry/review_decisions.v1.json >/dev/null
          python -m json.tool configs/data_foundry/coverage_policy.v1.json >/dev/null
          python -m json.tool configs/data_foundry/underlying_source_families.v1.json >/dev/null
          python -m json.tool configs/data_foundry/near_duplicate_policy.v1.json >/dev/null
          python -m json.tool schemas/data_foundry/asset-record.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/dataset-manifest.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/source-registry.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/acquisition-registry.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/intake-spec.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/raw-asset-candidate.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/review-decisions.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/split-policy.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/split-manifest.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/coverage-policy.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/canonical-asset-ledger.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/corpus-closure-readiness.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/corpus-certificate.schema.json >/dev/null
      - name: Validate Foundry source registry
        env:
          PYTHONPATH: src
        run: python -m echo.data_foundry.cli validate-source-registry configs/data_foundry/source_registry.v1.json
      - name: Validate release-safe coverage policy
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from echo.data_foundry.coverage_policy import load_coverage_policy
          from echo.data_foundry.ledger import load_underlying_source_policy
          p = load_coverage_policy("configs/data_foundry/coverage_policy.v1.json")
          assert "release_safe" in p["profiles"]
          family = load_underlying_source_policy("configs/data_foundry/underlying_source_families.v1.json")
          assert family["policy_id"] == "MK1-UNDERLYING-SOURCE-FAMILY-001"
          print(p["policy_id"])
          PY
      - name: Acquisition registry smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m echo.data_foundry.cli acquisition-plan fsd50k-1.0 --stage metadata >/dev/null
          python -m echo.data_foundry.cli acquisition-plan sonyc-ust-v2 --stage metadata >/dev/null
          python -m echo.data_foundry.cli acquisition-plan singapura-v1.0a --stage metadata >/dev/null
      - name: Corpus closure readiness smoke test
        env:
          PYTHONPATH: src
        run: |
          python scripts/data_foundry/build_corpus_closure_readiness.py --output /tmp/corpus-closure-readiness.json
          python -m json.tool /tmp/corpus-closure-readiness.json >/dev/null
      - name: Validate model-entry guard wiring
        run: python scripts/check_modeling_gate_wiring.py
      - name: Run Foundry unit and synthetic E2E tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
