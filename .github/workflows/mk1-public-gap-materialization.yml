name: MK1 Public Gap Materialization

on:
  push:
    branches: [main]
    paths:
      - 'configs/data_foundry/gap_source_candidates.v1.json'
      - 'configs/data_foundry/wikimedia_confusers.v1.json'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - 'scripts/materialize_public_gap_assets.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_wikimedia_confusers.py'
      - 'src/echo/data_foundry/probe.py'
      - '.github/workflows/mk1-public-gap-materialization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-gap-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governed source configs
        run: |
          python -m json.tool configs/data_foundry/gap_source_candidates.v1.json >/dev/null
          python -m json.tool configs/data_foundry/wikimedia_confusers.v1.json >/dev/null
      - name: Install deterministic media probe dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          set -o pipefail
          ffprobe -version | head -n 1
      - name: Materialize public real-media candidates
        id: materialize
        continue-on-error: true
        env:
          PYTHONPATH: src
          ECHO_GAP_ASSET_ROOT: ${{ runner.temp }}/echo-public-gap-assets
        run: python scripts/materialize_public_gap_assets.py
      - name: Validate evidence report
        if: ${{ always() }}
        run: python -m json.tool MK1/mining-site/materialization/public-gap-assets-report.json >/dev/null
      - name: Enforce free-tier artifact size budget
        if: ${{ always() }}
        env:
          ECHO_GAP_ASSET_ROOT: ${{ runner.temp }}/echo-public-gap-assets
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('configs/data_foundry/free_tier_boundary.v1.json').read_text())
          root = Path(os.environ['ECHO_GAP_ASSET_ROOT'])
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
          limit = int(policy['github_actions']['artifact_per_run_preferred_max_bytes'])
          print('artifact candidate bytes=', total, 'limit=', limit)
          if total > limit:
              raise SystemExit('free-tier artifact budget exceeded; do not upload dataset bytes')
          PY
      - name: Upload small real-media candidate artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: echo-public-gap-assets-${{ github.sha }}
          path: ${{ runner.temp }}/echo-public-gap-assets/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
      - name: Commit hashes/probes/license-page evidence only
        if: ${{ always() }}
        run: |
          cp MK1/mining-site/materialization/public-gap-assets-report.json /tmp/public-gap-assets-report.json
          git reset --hard HEAD
          git pull --rebase origin main
          cp /tmp/public-gap-assets-report.json MK1/mining-site/materialization/public-gap-assets-report.json
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git add MK1/mining-site/materialization/public-gap-assets-report.json
          if git diff --cached --quiet; then
            echo 'No evidence changes.'
          else
            git commit -m 'evidence(mk1): materialize public gap audio candidates [skip ci]'
            git push origin HEAD:main
          fi
      - name: Enforce materialization stop line
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('MK1/mining-site/materialization/public-gap-assets-report.json').read_text())
          print('materialized_count=', report['materialized_count'])
          print('failure_count=', report['failure_count'])
          if report['status'] != 'PASS':
              raise SystemExit('public gap materialization remains PARTIAL; inspect committed evidence report')
          PY
