name: MK1 Dataset Metadata Materialization

on:
  push:
    branches: [main]
    paths:
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'configs/data_foundry/materialization_plan.v1.json'
      - 'configs/data_foundry/gap_source_candidates.v1.json'
      - 'scripts/materialize_metadata_evidence.py'
      - '.github/workflows/mk1-dataset-metadata-materialization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize publisher metadata and exact-gap discovery evidence
        run: python scripts/materialize_metadata_evidence.py
      - name: Validate generated evidence JSON
        run: |
          python -m json.tool MK1/mining-site/materialization/publisher-metadata-materialization.json >/dev/null
          python -m json.tool MK1/mining-site/materialization/freesound-gap-discovery.json >/dev/null
          python -m json.tool MK1/mining-site/materialization/bigsoundbank-gap-page-evidence.json >/dev/null
      - name: Commit immutable evidence snapshots when changed
        run: |
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git add MK1/mining-site/materialization/*.json
          if git diff --cached --quiet; then
            echo 'No evidence changes.'
          else
            git commit -m 'evidence(mk1): materialize dataset metadata and gap candidates [skip ci]'
            git push origin HEAD:main
          fi
