name: ECHO Free-Tier Boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - 'governance/FREE-TIER-BOUNDARY.md'
      - 'scripts/check_free_tier_boundary.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - 'governance/FREE-TIER-BOUNDARY.md'
      - 'scripts/check_free_tier_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-tier-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate zero-cost execution boundary
        run: python scripts/check_free_tier_boundary.py
