name: MK1 Materialized Coverage Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/data_foundry/audit_materialized_coverage.py'
      - 'configs/data_foundry/coverage_policy.v1.json'
      - 'MK1/mining-site/materialization/sonyc-v2.3-full-materialization-summary.json'
      - 'MK1/mining-site/materialization/singapura-v1.0a-materialization-summary.json'
      - 'MK1/mining-site/materialization/esc50-pinned-materialization-summary.json'
      - 'MK1/mining-site/materialization/public-gap-assets-report.json'
      - 'MK1/mining-site/materialization/freesound-cc0-gap-assets-report.json'
      - 'MK1/mining-site/materialization/fsd50k-metadata-inspection.json'
      - '.github/workflows/mk1-materialized-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute conservative real-byte readiness audit
        run: python scripts/data_foundry/audit_materialized_coverage.py
      - name: Validate evidence structure and size
        run: |
          python -m json.tool MK1/mining-site/materialization/materialized-coverage-audit.json >/dev/null
          test $(stat -c%s MK1/mining-site/materialization/materialized-coverage-audit.json) -lt 1000000
      - name: Commit audit evidence
        run: |
          cp MK1/mining-site/materialization/materialized-coverage-audit.json /tmp/materialized-coverage-audit.json
          git reset --hard HEAD
          git pull --rebase origin main
          cp /tmp/materialized-coverage-audit.json MK1/mining-site/materialization/materialized-coverage-audit.json
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git add MK1/mining-site/materialization/materialized-coverage-audit.json
          if git diff --cached --quiet; then
            echo 'No materialized coverage audit changes.'
          else
            git commit -m 'evidence(mk1): audit materialized corpus readiness [skip ci]'
            git push origin HEAD:main
          fi
