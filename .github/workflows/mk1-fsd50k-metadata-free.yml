name: MK1 FSD50K Metadata Free Execution

on:
  push:
    branches: [main]
    paths:
      - 'scripts/data_foundry/inspect_fsd50k_metadata.py'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - '.github/workflows/mk1-fsd50k-metadata-free.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and inspect publisher metadata only
        run: |
          python scripts/data_foundry/inspect_fsd50k_metadata.py \
            --work-root '${{ runner.temp }}/echo-fsd50k-metadata' \
            --output '${{ runner.temp }}/fsd50k-metadata-inspection.json'
      - name: Enforce compact evidence and commit
        run: |
          test $(stat -c%s '${{ runner.temp }}/fsd50k-metadata-inspection.json') -lt 10000000
          cp '${{ runner.temp }}/fsd50k-metadata-inspection.json' MK1/mining-site/materialization/fsd50k-metadata-inspection.json
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git pull --rebase origin main
          git add MK1/mining-site/materialization/fsd50k-metadata-inspection.json
          if git diff --cached --quiet; then
            echo 'No FSD50K metadata evidence changes.'
          else
            git commit -m 'evidence(mk1): inspect FSD50K metadata under free-tier boundary [skip ci]'
            git push origin HEAD:main
          fi
