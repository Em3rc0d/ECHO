name: MK1 Corpus Closure Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mk1-corpus-closure-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ECHO-FREE-TIER-001
        run: python scripts/check_free_tier_boundary.py
      - name: Validate pipeline wiring
        run: python scripts/check_corpus_pipeline_wiring.py
      - name: Produce diagnostic closure evidence
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/data_foundry/build_corpus_closure_evidence.py
          python scripts/data_foundry/apply_split_conflict_quarantine.py
      - name: Verify process-level deterministic rebuild
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p /tmp/echo-closure-first
          cp MK1/mining-site/materialization/global-dedup-audit.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/recording-family-audit.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/split-integrity.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/coverage-gate.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/corpus-freeze-1.validation.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/corpus-freeze-2.validation.json /tmp/echo-closure-first/
          cp MK1/mining-site/materialization/corpus-reproducibility.json /tmp/echo-closure-first/
          python scripts/data_foundry/build_corpus_closure_evidence.py
          python scripts/data_foundry/apply_split_conflict_quarantine.py
          for name in global-dedup-audit.json recording-family-audit.json split-integrity.json coverage-gate.json corpus-freeze-1.validation.json corpus-freeze-2.validation.json corpus-reproducibility.json; do
            cmp "/tmp/echo-closure-first/$name" "MK1/mining-site/materialization/$name"
          done
      - name: Validate diagnostic evidence JSON and compactness
        run: |
          total=0
          for name in global-dedup-audit.json recording-family-audit.json split-integrity.json coverage-gate.json corpus-freeze-1.validation.json corpus-freeze-2.validation.json corpus-reproducibility.json; do
            python -m json.tool "MK1/mining-site/materialization/$name" >/dev/null
            bytes="$(stat -c%s "MK1/mining-site/materialization/$name")"
            total=$((total + bytes))
          done
          echo "closure diagnostic evidence bytes=$total"
          test "$total" -le 10000000
      - name: Assert diagnostic workflow is side-effect free
        run: |
          test -z "$(git status --porcelain --untracked-files=no -- .github configs src scripts tests)"
          echo 'Diagnostic closure workflow never persists to main; durable persistence belongs to MK1 Canonical Corpus Ledger.'
