name: MK1 Dataset Source Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/data_foundry/dataset_certification.v1.json'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'configs/data_foundry/source_registry.v1.json'
      - 'configs/data_foundry/publisher_snapshots/**'
      - 'schemas/data_foundry/dataset-certification.schema.json'
      - 'schemas/data_foundry/dataset-manifest.schema.json'
      - 'schemas/data_foundry/publisher-snapshot.schema.json'
      - 'src/echo/data_foundry/source_policy.py'
      - 'src/echo/data_foundry/publisher_snapshot.py'
      - 'src/echo/data_foundry/pipeline.py'
      - 'src/echo/data_foundry/manifest.py'
      - 'src/echo/data_foundry/cli.py'
      - 'src/echo/data_foundry/adapters.py'
      - 'tests/data_foundry/test_source_policy.py'
      - 'tests/data_foundry/test_publisher_snapshot.py'
      - '.github/workflows/mk1-dataset-source-certification.yml'
  pull_request:
    paths:
      - 'configs/data_foundry/dataset_certification.v1.json'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'configs/data_foundry/source_registry.v1.json'
      - 'configs/data_foundry/publisher_snapshots/**'
      - 'schemas/data_foundry/dataset-certification.schema.json'
      - 'schemas/data_foundry/dataset-manifest.schema.json'
      - 'schemas/data_foundry/publisher-snapshot.schema.json'
      - 'src/echo/data_foundry/source_policy.py'
      - 'src/echo/data_foundry/publisher_snapshot.py'
      - 'src/echo/data_foundry/pipeline.py'
      - 'src/echo/data_foundry/manifest.py'
      - 'src/echo/data_foundry/cli.py'
      - 'src/echo/data_foundry/adapters.py'
      - 'tests/data_foundry/test_source_policy.py'
      - 'tests/data_foundry/test_publisher_snapshot.py'
      - '.github/workflows/mk1-dataset-source-certification.yml'

permissions:
  contents: read

jobs:
  policy-snapshots-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Validate certification JSON syntax
        run: |
          python -m json.tool configs/data_foundry/dataset_certification.v1.json >/dev/null
          python -m json.tool schemas/data_foundry/dataset-certification.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/dataset-manifest.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/publisher-snapshot.schema.json >/dev/null
          for f in configs/data_foundry/publisher_snapshots/*.json; do python -m json.tool "$f" >/dev/null; done
      - name: Verify source policy
        env:
          PYTHONPATH: src
        run: |
          python -m echo.data_foundry.cli source-policy --profile release_safe >/dev/null
          python -m echo.data_foundry.cli source-policy --profile research_extended >/dev/null
      - name: Verify pinned official publisher evidence
        env:
          PYTHONPATH: src
        run: |
          python -m echo.data_foundry.cli verify-publisher-snapshot fsd50k-1.0
          python -m echo.data_foundry.cli verify-publisher-snapshot sonyc-ust-v2
          python -m echo.data_foundry.cli verify-publisher-snapshot singapura-v1.0a
      - name: Run Data Foundry tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
