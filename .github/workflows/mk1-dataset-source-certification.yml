name: MK1 Dataset Source Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/data_foundry/dataset_certification.v1.json'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'schemas/data_foundry/dataset-certification.schema.json'
      - 'schemas/data_foundry/dataset-manifest.schema.json'
      - 'src/echo/data_foundry/source_policy.py'
      - 'src/echo/data_foundry/pipeline.py'
      - 'src/echo/data_foundry/manifest.py'
      - 'src/echo/data_foundry/cli.py'
      - 'scripts/data_foundry/fetch_release_stage.py'
      - 'tests/data_foundry/test_source_policy.py'
      - '.github/workflows/mk1-dataset-source-certification.yml'
  pull_request:
    paths:
      - 'configs/data_foundry/dataset_certification.v1.json'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - 'schemas/data_foundry/dataset-certification.schema.json'
      - 'schemas/data_foundry/dataset-manifest.schema.json'
      - 'src/echo/data_foundry/source_policy.py'
      - 'src/echo/data_foundry/pipeline.py'
      - 'src/echo/data_foundry/manifest.py'
      - 'src/echo/data_foundry/cli.py'
      - 'scripts/data_foundry/fetch_release_stage.py'
      - 'tests/data_foundry/test_source_policy.py'
      - '.github/workflows/mk1-dataset-source-certification.yml'

permissions:
  contents: read

jobs:
  policy-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate certification JSON syntax
        run: |
          python -m json.tool configs/data_foundry/dataset_certification.v1.json >/dev/null
          python -m json.tool schemas/data_foundry/dataset-certification.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/dataset-manifest.schema.json >/dev/null
      - name: Validate source policy loader
        env:
          PYTHONPATH: src
        run: |
          python -m echo.data_foundry.cli source-policy --profile release_safe >/dev/null
          python -m echo.data_foundry.cli source-policy --profile research_extended >/dev/null
      - name: Run Data Foundry tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  publisher-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source_id:
          - fsd50k-1.0
          - sonyc-ust-v2
          - singapura-v1.0a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch publisher metadata stage
        env:
          PYTHONPATH: src
        run: |
          mkdir -p ".source-cache/${{ matrix.source_id }}" evidence
          python scripts/data_foundry/fetch_release_stage.py \
            "${{ matrix.source_id }}" \
            ".source-cache/${{ matrix.source_id }}" \
            --report "evidence/${{ matrix.source_id }}.json"
      - name: Verify publisher checksums independently
        env:
          PYTHONPATH: src
        run: |
          python -m echo.data_foundry.cli verify-acquisition \
            "${{ matrix.source_id }}" \
            ".source-cache/${{ matrix.source_id }}" \
            --stage metadata
      - uses: actions/upload-artifact@v4
        with:
          name: source-metadata-evidence-${{ matrix.source_id }}
          path: evidence/${{ matrix.source_id }}.json
          if-no-files-found: error
          retention-days: 30
