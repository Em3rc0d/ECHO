name: MK1 FSD50K Label Catalog

on:
  push:
    branches: [main]
    paths:
      - 'scripts/data_foundry/extract_fsd50k_label_catalog.py'
      - 'configs/data_foundry/acquisition_registry.v1.json'
      - '.github/workflows/mk1-fsd50k-label-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract pinned label catalog
        run: |
          python scripts/data_foundry/extract_fsd50k_label_catalog.py \
            --work-root '${{ runner.temp }}/echo-fsd50k-catalog' \
            --output '${{ runner.temp }}/fsd50k-label-catalog.json'
      - name: Commit catalog evidence
        run: |
          cp '${{ runner.temp }}/fsd50k-label-catalog.json' MK1/mining-site/materialization/fsd50k-label-catalog.json
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git pull --rebase origin main
          git add MK1/mining-site/materialization/fsd50k-label-catalog.json
          if git diff --cached --quiet; then
            echo 'No FSD50K catalog changes.'
          else
            git commit -m 'evidence(mk1): extract FSD50K label catalog [skip ci]'
            git push origin HEAD:main
          fi
