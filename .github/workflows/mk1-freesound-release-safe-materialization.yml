name: MK1 Freesound Release Safe Materialization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/data_foundry/materialize_freesound_release_safe.py'
      - 'MK1/mining-site/materialization/fsd50k-exact-freesound-candidates.json'
      - 'MK1/mining-site/materialization/freesound-gap-discovery.json'
      - 'configs/data_foundry/freesound_cc0_supplemental.v1.json'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - '.github/workflows/mk1-freesound-release-safe-materialization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mk1-freesound-release-safe-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce global zero-cost boundary
        run: python scripts/check_free_tier_boundary.py
      - name: Install free media probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
      - name: Materialize release-safe current Freesound previews
        env:
          PYTHONPATH: src
          ECHO_FREESOUND_RELEASE_SAFE_ROOT: ${{ runner.temp }}/echo-freesound-release-safe
        run: python scripts/data_foundry/materialize_freesound_release_safe.py
      - name: Enforce free-tier scratch/evidence budgets
        env:
          ECHO_FREESOUND_RELEASE_SAFE_ROOT: ${{ runner.temp }}/echo-freesound-release-safe
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          policy = json.loads(Path('configs/data_foundry/free_tier_boundary.v1.json').read_text())
          root = Path(os.environ['ECHO_FREESOUND_RELEASE_SAFE_ROOT'])
          scratch = sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
          limit = int(policy['github_actions']['project_max_working_set_bytes'])
          report = Path('MK1/mining-site/materialization/freesound-release-safe-materialization.json')
          print('scratch=', scratch, 'limit=', limit, 'report=', report.stat().st_size)
          if scratch > limit:
              raise SystemExit('release-safe Freesound scratch exceeded free-tier boundary')
          if report.stat().st_size > 25_000_000:
              raise SystemExit('durable Freesound evidence report exceeds 25 MB')
          PY
      - name: Commit durable rights/hash/probe evidence only
        run: |
          cp MK1/mining-site/materialization/freesound-release-safe-materialization.json /tmp/freesound-release-safe-materialization.json
          git reset --hard HEAD
          git pull --rebase origin main
          cp /tmp/freesound-release-safe-materialization.json MK1/mining-site/materialization/freesound-release-safe-materialization.json
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git add MK1/mining-site/materialization/freesound-release-safe-materialization.json
          if git diff --cached --quiet; then
            echo 'No release-safe Freesound evidence changes.'
          else
            git commit -m 'evidence(mk1): materialize release-safe Freesound candidates [skip ci]'
            git push origin HEAD:main
          fi
