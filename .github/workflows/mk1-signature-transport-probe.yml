name: MK1 Signature Sounds Transport Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mk1-signature-transport-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ECHO-FREE-TIER-001
        run: python scripts/check_free_tier_boundary.py
      - name: Probe MediaFire public metadata and link endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, urlopen

          key = '6nv1mqnl6ci14e7'
          ua = 'ECHO-Data-Foundry/1.0 (+https://github.com/Em3rc0d/ECHO)'

          def get(url):
              req = Request(url, headers={'User-Agent': ua, 'Accept': 'application/json,*/*'})
              with urlopen(req, timeout=30) as r:
                  body = r.read()
                  return r.status, r.headers.get_content_type(), r.geturl(), body

          def summarize(label, url):
              try:
                  status, ctype, final_url, body = get(url)
                  print(f'{label}: http={status} content_type={ctype} final_host={urlparse(final_url).hostname} bytes={len(body)}')
                  try:
                      obj = json.loads(body)
                  except Exception:
                      text = body.decode('utf-8', 'replace').casefold()
                      for marker in ('downloadbutton','data-scrambled-url','normal_download','captcha','cloudflare','download file'):
                          print(f'{label}: marker:{marker}={marker in text}')
                      return
                  response = obj.get('response', {}) if isinstance(obj, dict) else {}
                  print(f'{label}: result={response.get("result")} error={response.get("error")} message={response.get("message")}')
                  info = response.get('file_info') or {}
                  if isinstance(info, dict):
                      print(f'{label}: filename={info.get("filename")} size={info.get("size")} quickkey={info.get("quickkey")}')
                      links = info.get('links') or {}
                      if isinstance(links, dict):
                          for name, value in sorted(links.items()):
                              if isinstance(value, str):
                                  p = urlparse(value)
                                  print(f'{label}: link[{name}] scheme={p.scheme} host={p.hostname} path_suffix={p.path[-48:]}')
                  links = response.get('links') or []
                  if isinstance(links, dict):
                      links = [links]
                  if isinstance(links, list):
                      for idx, item in enumerate(links):
                          if isinstance(item, dict):
                              for name, value in sorted(item.items()):
                                  if isinstance(value, str) and value.startswith(('http://','https://')):
                                      p = urlparse(value)
                                      print(f'{label}: response_link[{idx}][{name}] scheme={p.scheme} host={p.hostname} path_suffix={p.path[-48:]}')
              except Exception as exc:
                  print(f'{label}: ERROR {type(exc).__name__}: {exc}')

          summarize('get_info', f'https://www.mediafire.com/api/file/get_info.php?{urlencode({"quick_key": key, "response_format": "json"})}')
          for link_type in ('normal_download','direct_download'):
              summarize(f'get_links:{link_type}', f'https://www.mediafire.com/api/file/get_links.php?{urlencode({"quick_key": key, "link_type": link_type, "response_format": "json"})}')
          PY

# Probe is intentionally metadata-only and grants zero corpus credit.
