name: MK1 Signature Sounds Glass CC0 Materialization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize_signature_sounds_glass_cc0.py'
      - 'configs/data_foundry/signature_sounds_glass_cc0.v1.json'
      - 'src/echo/data_foundry/canonical_fingerprints.py'
      - 'src/echo/data_foundry/probe.py'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - '.github/workflows/mk1-signature-sounds-glass-cc0-materialization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mk1-signature-sounds-glass-cc0-main
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ECHO-FREE-TIER-001
        env:
          PYTHONPATH: src
        run: python scripts/check_free_tier_boundary.py
      - name: Validate governed source config
        run: python -m json.tool configs/data_foundry/signature_sounds_glass_cc0.v1.json >/dev/null
      - name: Install free media probe and canonical decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          set -o pipefail
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Materialize independent CC0 glass archive evidence
        env:
          PYTHONPATH: src
          ECHO_SIGNATURE_SOUNDS_GLASS_ROOT: ${{ runner.temp }}/echo-signature-sounds-glass
        run: python scripts/materialize_signature_sounds_glass_cc0.py
      - name: Enforce discovery evidence and free-tier boundaries
        env:
          ECHO_SIGNATURE_SOUNDS_GLASS_ROOT: ${{ runner.temp }}/echo-signature-sounds-glass
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          policy = json.loads(Path('configs/data_foundry/free_tier_boundary.v1.json').read_text())
          config = json.loads(Path('configs/data_foundry/signature_sounds_glass_cc0.v1.json').read_text())
          report_path = Path('MK1/mining-site/materialization/signature-sounds-glass-cc0-materialization.json')
          report = json.loads(report_path.read_text())
          root = Path(os.environ['ECHO_SIGNATURE_SOUNDS_GLASS_ROOT'])
          scratch = sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) if root.exists() else 0
          working_limit = int(policy['github_actions']['project_max_working_set_bytes'])
          minimum = int(config['governance']['minimum_audio_entries'])
          archive = report['archive_evidence']
          print('scratch bytes=', scratch, 'working-set limit=', working_limit)
          print('status=', report['status'], 'materialized=', report['materialized_count'], 'fingerprinted=', report['fingerprinted_count'])
          print('archive sha256=', archive['archive_sha256'], 'pin status=', archive['pin_status'])
          if scratch > working_limit:
              raise SystemExit('Signature Sounds scratch exceeded free-tier working-set boundary')
          if report_path.stat().st_size > 5_000_000:
              raise SystemExit('Signature Sounds durable evidence unexpectedly exceeds 5 MB')
          if report['status'] != 'PASS':
              raise SystemExit('Signature Sounds evidence materialization is not PASS')
          if report['materialized_count'] < minimum or report['materialized_count'] != report['fingerprinted_count']:
              raise SystemExit('Signature Sounds WAV/fingerprint evidence incomplete')
          if report['positive_candidate_group_count'] != 1:
              raise SystemExit('Signature Sounds conservative one-family contract drift')
          if not re.fullmatch(r'[0-9a-f]{64}', archive['archive_sha256']):
              raise SystemExit('Signature Sounds archive SHA-256 missing')
          expected = config['acquisition_transport']['expected_archive_sha256']
          if expected is None and archive['pin_status'] != 'DISCOVERED_UNPINNED':
              raise SystemExit('discovery run must remain unpinned and grant zero admission credit')
          if expected is not None and archive['pin_status'] != 'PINNED_MATCH':
              raise SystemExit('pinned run did not match governed archive identity')
          if report['transport_evidence']['source_credit'] is not False:
              raise SystemExit('MediaFire transport source-credit inflation detected')
          PY
      - name: Upload bounded evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: signature-sounds-glass-cc0-evidence
          path: MK1/mining-site/materialization/signature-sounds-glass-cc0-materialization.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Commit durable evidence only if main is unchanged
        run: |
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git fetch origin main
          RUN_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          echo "run_sha=$RUN_SHA"
          echo "remote_main_sha=$REMOTE_MAIN_SHA"
          if [[ "$RUN_SHA" != "$REMOTE_MAIN_SHA" ]]; then
            echo 'main moved after this Signature Sounds run started; refusing to persist stale evidence'
            exit 1
          fi
          git add MK1/mining-site/materialization/signature-sounds-glass-cc0-materialization.json
          if git diff --cached --quiet; then
            echo 'No Signature Sounds evidence changes.'
          else
            git commit -m 'evidence(mk1): materialize Signature Sounds glass CC0 archive [skip ci]'
            git push origin HEAD:main
          fi
