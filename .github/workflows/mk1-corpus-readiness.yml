name: MK1 Corpus Closure Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MK1/mining-site/materialization/canonical-release-safe-asset-ledger-summary.json'
      - 'MK1/mining-site/materialization/global-dedup-audit.json'
      - 'MK1/mining-site/materialization/recording-family-audit.json'
      - 'MK1/mining-site/materialization/split-integrity.json'
      - 'MK1/mining-site/materialization/coverage-gate.json'
      - 'MK1/mining-site/materialization/corpus-freeze-1.validation.json'
      - 'MK1/mining-site/materialization/corpus-freeze-2.validation.json'
      - 'MK1/mining-site/materialization/corpus-reproducibility.json'
      - 'configs/data_foundry/coverage_policy.v1.json'
      - 'src/echo/data_foundry/readiness.py'
      - 'scripts/data_foundry/build_corpus_closure_readiness.py'
      - 'scripts/check_modeling_gate_wiring.py'
      - 'schemas/data_foundry/corpus-closure-readiness.schema.json'
      - '.github/workflows/mk1-corpus-readiness.yml'
      - '.github/workflows/mk1-model-entry-gate.yml'

permissions:
  contents: write

concurrency:
  group: mk1-corpus-closure-readiness-main
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ECHO-FREE-TIER-001
        run: python scripts/check_free_tier_boundary.py
      - name: Validate readiness schema JSON
        run: python -m json.tool schemas/data_foundry/corpus-closure-readiness.schema.json >/dev/null
      - name: Build fail-closed readiness evidence
        env:
          PYTHONPATH: src
        run: python scripts/data_foundry/build_corpus_closure_readiness.py
      - name: Verify deterministic rebuild
        env:
          PYTHONPATH: src
        run: |
          cp MK1/mining-site/materialization/corpus-closure-readiness.json /tmp/readiness.first.json
          python scripts/data_foundry/build_corpus_closure_readiness.py
          cmp /tmp/readiness.first.json MK1/mining-site/materialization/corpus-closure-readiness.json
      - name: Verify model workflows cannot bypass corpus gate
        run: python scripts/check_modeling_gate_wiring.py
      - name: Enforce compact durable evidence
        run: test "$(stat -c%s MK1/mining-site/materialization/corpus-closure-readiness.json)" -le 500000
      - name: Fail if baseline moved before evidence commit
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Commit durable readiness evidence
        run: |
          if [ -z "$(git status --porcelain -- MK1/mining-site/materialization/corpus-closure-readiness.json)" ]; then
            echo "Corpus readiness evidence already current"
            exit 0
          fi
          git config user.name "echo-data-foundry-bot"
          git config user.email "123134857+Em3rc0d@users.noreply.github.com"
          git add MK1/mining-site/materialization/corpus-closure-readiness.json
          git diff --cached --quiet && exit 0
          git commit -m "evidence(mk1): refresh corpus closure readiness [skip ci]"
          git push origin HEAD:main
