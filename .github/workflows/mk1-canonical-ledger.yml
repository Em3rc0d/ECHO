name: MK1 Canonical Corpus Ledger

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'MK1 Freesound Release Safe Materialization'
      - 'MK1 Freesound CC0 Free Materialization'
      - 'MK1 SONYC Free Materialization'
      - 'MK1 OpenGameArt Rubberduck CC0 Materialization'
      - 'MK1 OpenGameArt Glass Expansion Materialization'
      - 'MK1 Public Gap Materialization'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'MK1/mining-site/materialization/sonyc-v2.3-full-materialization-summary.json'
      - 'MK1/mining-site/materialization/sonyc-v2.3-target-candidates.jsonl'
      - 'MK1/mining-site/materialization/sonyc-v2.3-confuser-candidates.jsonl'
      - 'MK1/mining-site/materialization/freesound-release-safe-materialization.json'
      - 'MK1/mining-site/materialization/freesound-cc0-gap-assets-report.json'
      - 'MK1/mining-site/materialization/public-gap-assets-report.json'
      - 'MK1/mining-site/materialization/opengameart-rubberduck-cc0-materialization.json'
      - 'MK1/mining-site/materialization/opengameart-glass-expansion-materialization.json'
      - 'MK1/mining-site/materialization/singapura-v1.0a-materialization-summary.json'
      - 'MK1/mining-site/materialization/esc50-pinned-materialization-summary.json'
      - 'MK1/mining-site/materialization/fsd50k-metadata-inspection.json'
      - 'MK1/mining-site/materialization/fsd50k-exact-freesound-candidates.json'
      - 'configs/data_foundry/dataset_certification.v1.json'
      - 'configs/data_foundry/source_registry.v1.json'
      - 'configs/data_foundry/underlying_source_families.v1.json'
      - 'configs/data_foundry/opengameart_rubberduck_cc0.v1.json'
      - 'configs/data_foundry/opengameart_glass_expansion.v1.json'
      - 'configs/data_foundry/bigsoundbank_confusers.v1.json'
      - 'configs/data_foundry/hard_negative_mapping.v1.json'
      - 'configs/data_foundry/near_duplicate_policy.v1.json'
      - 'configs/data_foundry/split_policy.v1.json'
      - 'configs/data_foundry/coverage_policy.v1.json'
      - 'configs/data_foundry/free_tier_boundary.v1.json'
      - 'schemas/data_foundry/canonical-asset-ledger.schema.json'
      - 'schemas/data_foundry/corpus-closure-readiness.schema.json'
      - 'schemas/data_foundry/corpus-certificate.schema.json'
      - 'src/echo/data_foundry/ledger.py'
      - 'src/echo/data_foundry/canonical_fingerprints.py'
      - 'src/echo/data_foundry/coverage_policy.py'
      - 'src/echo/data_foundry/splits.py'
      - 'src/echo/data_foundry/readiness.py'
      - 'src/echo/data_foundry/certification.py'
      - 'scripts/data_foundry/build_canonical_asset_ledger.py'
      - 'scripts/data_foundry/enrich_ledger_with_freesound_hard_negatives.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_cc0_gaps.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_opengameart_cc0.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_till_behrend_glass.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_wikimedia_confusers.py'
      - 'scripts/data_foundry/augment_canonical_ledger_with_bigsoundbank_confusers.py'
      - 'scripts/data_foundry/enrich_canonical_asset_ledger.py'
      - 'scripts/data_foundry/enforce_canonical_ledger_role_boundary.py'
      - 'scripts/data_foundry/resolve_global_recording_groups.py'
      - 'scripts/data_foundry/build_corpus_closure_evidence.py'
      - 'scripts/data_foundry/apply_split_conflict_quarantine.py'
      - 'scripts/data_foundry/build_corpus_closure_readiness.py'
      - 'scripts/data_foundry/emit_corpus_certificate.py'
      - 'scripts/check_corpus_pipeline_wiring.py'
      - 'scripts/check_modeling_gate_wiring.py'
      - 'scripts/check_free_tier_boundary.py'
      - 'MK1/test/DATA-FOUNDRY-TOOLCHAIN-RECERTIFICATION-005.md'
      - 'MK1/build/data-foundry/CORPUS-CERTIFICATE-HANDOFF.md'
      - '.github/workflows/mk1-canonical-ledger.yml'
      - '.github/workflows/mk1-corpus-closure-evidence.yml'
      - '.github/workflows/mk1-corpus-readiness.yml'
      - '.github/workflows/mk1-model-entry-gate.yml'

permissions:
  contents: write

concurrency:
  group: mk1-corpus-evidence-pipeline-main
  cancel-in-progress: false

jobs:
  build-ledger:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 1
      - name: Resolve exact durable baseline
        run: |
          echo "ECHO_PIPELINE_BASELINE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "pipeline baseline=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce global zero-cost boundary
        run: python scripts/check_free_tier_boundary.py
      - name: Validate pipeline wiring
        run: python scripts/check_corpus_pipeline_wiring.py
      - name: Validate ledger, readiness and certificate contracts
        run: |
          python -m json.tool configs/data_foundry/dataset_certification.v1.json >/dev/null
          python -m json.tool configs/data_foundry/source_registry.v1.json >/dev/null
          python -m json.tool configs/data_foundry/underlying_source_families.v1.json >/dev/null
          python -m json.tool configs/data_foundry/freesound_cc0_supplemental.v1.json >/dev/null
          python -m json.tool configs/data_foundry/opengameart_rubberduck_cc0.v1.json >/dev/null
          python -m json.tool configs/data_foundry/opengameart_glass_expansion.v1.json >/dev/null
          python -m json.tool configs/data_foundry/wikimedia_confusers.v1.json >/dev/null
          python -m json.tool configs/data_foundry/bigsoundbank_confusers.v1.json >/dev/null
          python -m json.tool configs/data_foundry/hard_negative_mapping.v1.json >/dev/null
          python -m json.tool configs/data_foundry/near_duplicate_policy.v1.json >/dev/null
          python -m json.tool configs/data_foundry/split_policy.v1.json >/dev/null
          python -m json.tool configs/data_foundry/coverage_policy.v1.json >/dev/null
          python -m json.tool schemas/data_foundry/canonical-asset-ledger.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/corpus-closure-readiness.schema.json >/dev/null
          python -m json.tool schemas/data_foundry/corpus-certificate.schema.json >/dev/null
      - name: Build canonical release-safe corpus ledger
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/data_foundry/build_canonical_asset_ledger.py
          python scripts/data_foundry/enrich_ledger_with_freesound_hard_negatives.py
          python scripts/data_foundry/augment_canonical_ledger_with_cc0_gaps.py
          python scripts/data_foundry/augment_canonical_ledger_with_opengameart_cc0.py
          python scripts/data_foundry/augment_canonical_ledger_with_till_behrend_glass.py
          python scripts/data_foundry/augment_canonical_ledger_with_wikimedia_confusers.py
          python scripts/data_foundry/augment_canonical_ledger_with_bigsoundbank_confusers.py
          python scripts/data_foundry/enrich_canonical_asset_ledger.py
          python scripts/data_foundry/enforce_canonical_ledger_role_boundary.py
          python scripts/data_foundry/resolve_global_recording_groups.py
      - name: Build closure evidence and execute certificate handoff
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/data_foundry/build_corpus_closure_evidence.py
          python scripts/data_foundry/apply_split_conflict_quarantine.py
          python scripts/data_foundry/build_corpus_closure_readiness.py --ignore-corpus-certificate --output /tmp/corpus-readiness.pre-cert.json
          python scripts/data_foundry/emit_corpus_certificate.py --readiness /tmp/corpus-readiness.pre-cert.json --if-eligible
          python scripts/data_foundry/build_corpus_closure_readiness.py
          python - <<'PY'
          import json
          from pathlib import Path
          pre = json.loads(Path('/tmp/corpus-readiness.pre-cert.json').read_text())
          final = json.loads(Path('MK1/mining-site/materialization/corpus-closure-readiness.json').read_text())
          eligible = (
              pre.get('eligible_for_certificate_review') is True
              and pre.get('status') == 'BLOCKED'
              and pre.get('modeling_allowed') is False
              and pre.get('gap_codes') == ['CORPUS_CERTIFICATE_NOT_CERTIFIED']
          )
          if eligible:
              assert final.get('status') == 'READY', final
              assert final.get('modeling_allowed') is True, final
              assert final.get('gap_codes') == [], final
              assert final.get('next_authorized_stage') == 'BENCHMARK_A_B_C', final
              assert (final.get('corpus_certificate') or {}).get('status') == 'CERTIFIED', final
          else:
              assert final.get('modeling_allowed') is False, final
              assert final.get('next_authorized_stage') == 'CORPUS_FOUNDRY_CLOSURE', final
          print('certificate handoff eligible=', eligible, 'final_status=', final.get('status'))
          PY
      - name: Verify process-level deterministic full cascade
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p /tmp/echo-cascade-first
          paths=(
            canonical-release-safe-asset-ledger.jsonl
            canonical-release-safe-asset-ledger-summary.json
            global-dedup-audit.json
            recording-family-audit.json
            split-integrity.json
            coverage-gate.json
            corpus-freeze-1.validation.json
            corpus-freeze-2.validation.json
            corpus-reproducibility.json
            corpus-closure-readiness.json
          )
          for name in "${paths[@]}"; do
            cp "MK1/mining-site/materialization/$name" "/tmp/echo-cascade-first/$name"
          done
          cp /tmp/corpus-readiness.pre-cert.json /tmp/echo-cascade-first/corpus-readiness.pre-cert.json
          if [ -f MK1/mining-site/materialization/cert-mk1-df-corpus-001.json ]; then
            cp MK1/mining-site/materialization/cert-mk1-df-corpus-001.json /tmp/echo-cascade-first/cert-mk1-df-corpus-001.json
            echo present > /tmp/echo-cascade-first/certificate-state
          else
            echo absent > /tmp/echo-cascade-first/certificate-state
          fi
          python scripts/data_foundry/build_canonical_asset_ledger.py
          python scripts/data_foundry/enrich_ledger_with_freesound_hard_negatives.py
          python scripts/data_foundry/augment_canonical_ledger_with_cc0_gaps.py
          python scripts/data_foundry/augment_canonical_ledger_with_opengameart_cc0.py
          python scripts/data_foundry/augment_canonical_ledger_with_till_behrend_glass.py
          python scripts/data_foundry/augment_canonical_ledger_with_wikimedia_confusers.py
          python scripts/data_foundry/augment_canonical_ledger_with_bigsoundbank_confusers.py
          python scripts/data_foundry/enrich_canonical_asset_ledger.py
          python scripts/data_foundry/enforce_canonical_ledger_role_boundary.py
          python scripts/data_foundry/resolve_global_recording_groups.py
          python scripts/data_foundry/build_corpus_closure_evidence.py
          python scripts/data_foundry/apply_split_conflict_quarantine.py
          python scripts/data_foundry/build_corpus_closure_readiness.py --ignore-corpus-certificate --output /tmp/corpus-readiness.pre-cert.json
          python scripts/data_foundry/emit_corpus_certificate.py --readiness /tmp/corpus-readiness.pre-cert.json --if-eligible
          python scripts/data_foundry/build_corpus_closure_readiness.py
          cmp /tmp/echo-cascade-first/corpus-readiness.pre-cert.json /tmp/corpus-readiness.pre-cert.json
          for name in "${paths[@]}"; do
            cmp "/tmp/echo-cascade-first/$name" "MK1/mining-site/materialization/$name"
          done
          if grep -qx present /tmp/echo-cascade-first/certificate-state; then
            cmp /tmp/echo-cascade-first/cert-mk1-df-corpus-001.json MK1/mining-site/materialization/cert-mk1-df-corpus-001.json
          else
            test ! -f MK1/mining-site/materialization/cert-mk1-df-corpus-001.json
          fi
      - name: Validate durable JSON and compactness
        run: |
          total=0
          for name in canonical-release-safe-asset-ledger-summary.json global-dedup-audit.json recording-family-audit.json split-integrity.json coverage-gate.json corpus-freeze-1.validation.json corpus-freeze-2.validation.json corpus-reproducibility.json corpus-closure-readiness.json; do
            python -m json.tool "MK1/mining-site/materialization/$name" >/dev/null
            bytes="$(stat -c%s "MK1/mining-site/materialization/$name")"
            total=$((total + bytes))
          done
          if [ -f MK1/mining-site/materialization/cert-mk1-df-corpus-001.json ]; then
            python -m json.tool MK1/mining-site/materialization/cert-mk1-df-corpus-001.json >/dev/null
            total=$((total + $(stat -c%s MK1/mining-site/materialization/cert-mk1-df-corpus-001.json)))
          fi
          ledger_bytes="$(stat -c%s MK1/mining-site/materialization/canonical-release-safe-asset-ledger.jsonl)"
          echo "atomic corpus evidence bytes=$((total + ledger_bytes))"
          test "$ledger_bytes" -le 25000000
          test "$total" -le 12000000
      - name: Fail if exact baseline moved before durable commit
        run: |
          git fetch origin main --depth=1
          test "$ECHO_PIPELINE_BASELINE" = "$(git rev-parse HEAD)"
          test "$ECHO_PIPELINE_BASELINE" = "$(git rev-parse origin/main)"
      - name: Commit atomic corpus evidence cascade
        run: |
          paths=(
            MK1/mining-site/materialization/canonical-release-safe-asset-ledger.jsonl
            MK1/mining-site/materialization/canonical-release-safe-asset-ledger-summary.json
            MK1/mining-site/materialization/global-dedup-audit.json
            MK1/mining-site/materialization/recording-family-audit.json
            MK1/mining-site/materialization/split-integrity.json
            MK1/mining-site/materialization/coverage-gate.json
            MK1/mining-site/materialization/corpus-freeze-1.validation.json
            MK1/mining-site/materialization/corpus-freeze-2.validation.json
            MK1/mining-site/materialization/corpus-reproducibility.json
            MK1/mining-site/materialization/corpus-closure-readiness.json
          )
          if [ -f MK1/mining-site/materialization/cert-mk1-df-corpus-001.json ]; then
            paths+=(MK1/mining-site/materialization/cert-mk1-df-corpus-001.json)
          fi
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'Atomic corpus evidence already current.'
            exit 0
          fi
          git config user.name 'echo-data-foundry-bot'
          git config user.email '123134857+Em3rc0d@users.noreply.github.com'
          git add "${paths[@]}"
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(mk1): refresh atomic corpus evidence cascade [skip ci]'
          git push origin HEAD:main
