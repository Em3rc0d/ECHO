name: ECHO Documentation Governance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute current readiness projection without persisting
        env:
          PYTHONPATH: src
        run: python scripts/data_foundry/build_corpus_closure_readiness.py
      - name: Validate documentation and certification truth
        run: python scripts/check_documentation_governance.py
      - name: Re-validate global zero-cost boundary
        run: python scripts/check_free_tier_boundary.py
