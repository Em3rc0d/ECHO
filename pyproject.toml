[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-acoustic"
version = "0.1.0.dev0"
description = "ECHO — intelligent detection and classification of acoustic events"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mvp = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "paho-mqtt>=2.1,<3",
]
yamnet = [
  "tensorflow>=2.16,<3",
  "tensorflow-hub==0.16.1",
]
panns = [
  "panns-inference==0.1.1",
]
mvp-full = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "paho-mqtt>=2.1,<3",
  "tensorflow>=2.16,<3",
  "tensorflow-hub==0.16.1",
  "panns-inference==0.1.1",
]

[project.scripts]
echo-data-foundry = "echo.data_foundry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
